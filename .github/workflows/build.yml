name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest project zip
        run: |
          best=""
          bt=0
          while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f")
            t=${t:-0}
            if [ "$t" -ge "$bt" ]; then
              bt=$t
              best="$f"
            fi
          done < <(find . -type f -iname 'MaterialYouKeyboard*.zip' -not -path './.git/*')
          echo "Using: $best"
          test -n "$best"
          unzip -qo "$best"
      - name: Read version
        id: ver
        run: |
          f=MaterialYouKeyboard/app/build.gradle.kts
          echo "code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' $f)" >> $GITHUB_OUTPUT
          echo "name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' $f)" >> $GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: MaterialYouKeyboard
      - uses: actions/upload-artifact@v4
        with:
          name: YouBoard
          path: MaterialYouKeyboard/app/build/outputs/apk/debug/YouBoard.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.ver.outputs.code }}
          name: YouBoard ${{ steps.ver.outputs.name }}
          prerelease: false
          make_latest: true
          body_path: MaterialYouKeyboard/RELEASE_NOTES.md
          files: MaterialYouKeyboard/app/build/outputs/apk/debug/YouBoard.apk
